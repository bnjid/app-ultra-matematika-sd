      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);

      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.

      window.Babel.transformScriptTags();

    console.error('Bundle unpack error:', err);

asih, orang baik!<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n<header style=\"max-width:1120px;margin:0 auto;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px\">\n  <div sc-camel-on-click=\"{{ goHome }}\" style=\"display:flex;align-items:center;gap:12px;cursor:pointer\">\n    <div style=\"width:44px;height:44px;border-radius:14px;background:#1A1C29;color:#fff;display:grid;place-items:center;font-family:Lexend,sans-serif;font-weight:700;font-size:24px;line-height:1\">÷<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;line-height:1.15\">\n      <span style=\"font-weight:800;font-size:17px;letter-spacing:-0.01em\">Super Cerdas<\u002Fspan>\n      <span style=\"font-weight:600;font-size:13px;color:#6A6E7E\">Matematika SD<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end\">\n  <button sc-camel-on-click=\"{{ openSupport }}\" style=\"position:relative;overflow:hidden;white-space:nowrap;flex-shrink:0;height:42px;padding:0 18px;border:none;border-radius:999px;background:linear-gradient(135deg,oklch(0.80 0.16 75),oklch(0.66 0.20 30));color:#fff;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 8px 20px -8px oklch(0.6 0.2 40);animation:scmPulse 2.4s ease-in-out infinite\"><span style=\"position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.8),transparent);transform:skewX(-20deg);animation:scmShine 2.6s ease-in-out infinite\"><\u002Fspan><span style=\"position:relative\">♥ Dukung Kami<\u002Fspan><\u002Fbutton>\n  <button sc-camel-on-click=\"{{ toggleSound }}\" style=\"white-space:nowrap;flex-shrink:0;height:42px;padding:0 16px;border-radius:999px;border:1px solid #E7E4DB;background:#fff;color:#1A1C29;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px\"><span style=\"width:8px;height:8px;border-radius:99px;background:{{ soundDot }}\"><\u002Fspan>{{ soundLabel }}<\u002Fbutton>\n  <sc-if value=\"{{ hasName }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;background:#fff;border:1px solid #E7E4DB;border-radius:999px\">\n      <span style=\"width:30px;height:30px;border-radius:999px;background:oklch(0.94 0.045 280);color:oklch(0.42 0.13 280);display:grid;place-items:center;font-weight:800;font-size:14px\">{{ initial }}<\u002Fspan>\n      <span style=\"font-weight:700;font-size:14px\">{{ name }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n<main style=\"max-width:1120px;margin:0 auto;padding:4px 24px 64px;display:flex;flex-direction:column;gap:36px\">\n  <section style=\"background:#fff;border:1px solid #E7E4DB;border-radius:32px;padding:clamp(24px,4vw,48px);display:flex;flex-wrap:wrap;gap:32px;align-items:center;overflow:hidden\">\n    <div style=\"flex:1 1 400px;display:flex;flex-direction:column;gap:22px;min-width:0\">\n      <span style=\"align-self:flex-start;padding:6px 12px;border-radius:999px;background:oklch(0.94 0.045 150);color:oklch(0.40 0.12 150);font-weight:700;font-size:13px\">Latihan harian · Kelas 4–6<\u002Fspan>\n      <h1 style=\"margin:0;font-size:clamp(32px,4.6vw,54px);line-height:1.05;letter-spacing:-0.03em;font-weight:800;text-wrap:pretty\">Halo, {{ greetName }}! Siap jadi juara matematika?<\u002Fh1>\n      <p style=\"margin:0;font-size:17px;line-height:1.55;color:#555A6B;max-width:520px;text-wrap:pretty\">Pilih level dan topik. Setiap kuis berisi {{ nQ }} soal acak (pilihan ganda &amp; isian) dari bank 200 soal, dengan waktu {{ dur }} detik per soal. Kunci jawaban dan pembahasan muncul di akhir.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end\">\n        <label style=\"display:flex;flex-direction:column;gap:8px;flex:1 1 220px;max-width:300px\">\n          <span style=\"font-size:13px;font-weight:700;color:#6A6E7E\">Nama kamu<\u002Fspan>\n          <input value=\"{{ name }}\" sc-camel-on-change=\"{{ onName }}\" placeholder=\"Tulis namamu\" maxlength=\"20\" style=\"height:52px;padding:0 18px;border-radius:16px;border:1.5px solid #E1DDD2;background:#FAF9F6;font-family:inherit;font-size:16px;font-weight:600;color:#1A1C29\">\n        <\u002Flabel>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <span style=\"font-size:13px;font-weight:700;color:#6A6E7E\">Level<\u002Fspan>\n          <div style=\"display:flex;gap:4px;padding:4px;background:#F1EFE9;border-radius:16px\">\n            <sc-for list=\"{{ levels }}\" as=\"lv\" hint-placeholder-count=\"3\">\n              <button sc-camel-on-click=\"{{ lv.onClick }}\" style=\"height:44px;padding:0 18px;border:none;border-radius:12px;background:{{ lv.bg }};color:{{ lv.ink }};font-weight:700;font-size:15px;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:{{ lv.shadow }}\">\n                <span style=\"width:8px;height:8px;border-radius:99px;background:{{ lv.dot }}\"><\u002Fspan>{{ lv.label }}\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 300px;position:relative;min-height:280px;min-width:0\">\n      <div style=\"position:absolute;left:4%;top:6%;transform:rotate(-6deg);white-space:nowrap;padding:16px 22px;border-radius:22px;background:oklch(0.94 0.045 25);color:oklch(0.42 0.13 25);font-family:Lexend,sans-serif;font-weight:600;font-size:30px;font-variant-numeric:tabular-nums\">7 × 8 = 56<\u002Fdiv>\n      <div style=\"position:absolute;right:4%;top:40%;white-space:nowrap;transform:rotate(5deg);padding:16px 26px;border-radius:22px;background:oklch(0.94 0.045 290);color:oklch(0.42 0.13 290);font-family:Lexend,sans-serif;font-weight:600;font-size:44px;display:flex;align-items:center;gap:10px\">\n        <span style=\"display:inline-flex;flex-direction:column;align-items:center;line-height:1.02;font-size:0.64em\"><span style=\"padding:0 0.18em 0.1em\">3<\u002Fspan><span style=\"align-self:stretch;height:3px;background:currentColor;border-radius:2px\"><\u002Fspan><span style=\"padding:0.1em 0.18em 0\">4<\u002Fspan><\u002Fspan><span>+<\u002Fspan><span style=\"display:inline-flex;flex-direction:column;align-items:center;line-height:1.02;font-size:0.64em\"><span style=\"padding:0 0.18em 0.1em\">1<\u002Fspan><span style=\"align-self:stretch;height:3px;background:currentColor;border-radius:2px\"><\u002Fspan><span style=\"padding:0.1em 0.18em 0\">4<\u002Fspan><\u002Fspan><span>= 1<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"position:absolute;left:14%;bottom:6%;white-space:nowrap;transform:rotate(-3deg);padding:16px 22px;border-radius:22px;background:#1A1C29;color:#fff;font-family:Lexend,sans-serif;font-weight:500;font-size:28px\">L = π × r²<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"display:flex;flex-direction:column;gap:18px\">\n    <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap\">\n      <h2 style=\"margin:0;font-size:26px;letter-spacing:-0.02em;font-weight:800\">Pilih topik<\u002Fh2>\n      <span style=\"font-size:14px;font-weight:600;color:#6A6E7E\">{{ nFeats }} topik · Level {{ levelLabel }} · 200 soal per topik<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:16px\">\n      <sc-for list=\"{{ feats }}\" as=\"f\" hint-placeholder-count=\"6\">\n        <button sc-camel-on-click=\"{{ f.onClick }}\" style=\"text-align:left;border:1px solid #E7E4DB;background:#fff;border-radius:26px;padding:22px;display:flex;gap:18px;align-items:center;cursor:pointer;color:#1A1C29;transition:transform .15s,box-shadow .15s\" style-hover=\"transform:translateY(-3px);box-shadow:0 14px 30px -14px rgba(26,28,4 06 75);border-radius:28px;padding:clamp(22px,3.5vw,36px);display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between\">\n    <div style=\"flex:1 1 420px;display:flex;flex-direction:column;gap:8px;min-width:0\">\n      <span style=\"font-size:13px;font-weight:800;color:oklch(0.48 0.13 55);letter-spacing:.04em\">GRATIS UNTUK SEMUA<\u002Fspan>\n      <h3 style=\"margin:0;font-size:clamp(22px,2.6vw,28px);font-weight:800;letter-spacing:-0.02em;line-height:1.2;text-wrap:pretty\">Bantu ribuan anak belajar matematika dengan gembira.<\u002Fh3>\n      <p style=\"margin:0;font-size:16px;line-height:1.55;color:#555A6B;text-wrap:pretty\">Aplikasi ini dibuat tanpa iklan. Dukunganmu lewat QRIS, berapa pun nominalnya, membuat soal baru dan fitur baru terus bertambah.<\u002Fp>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ openSupport }}\" style=\"position:relative;overflow:hidden;white-space:nowrap;height:60px;padding:0 30px;border:none;border-radius:20px;background:linear-gradient(135deg,oklch(0.80 0.16 75),oklch(0.66 0.20 30));color:#fff;font-weight:800;font-size:17px;cursor:pointer;box-shadow:0 12px 28px -10px oklch(0.6 0.2 40);animation:scmPulse 2.4s ease-in-out infinite\"><span style=\"position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.8),transparent);transform:skewX(-20deg);animation:scmShine 2.6s ease-in-out infinite\"><\u002Fspan><span style=\"position:relative\">♥ Beri Dukungan Sekarang<\u002Fspan><\u002Fbutton>\n  <\u002Fsection>\n\n  <sc-if value=\"{{ hasHist }}\" hint-placeholder-val=\"{{ false }}\">\n  <section style=\"display:flex;flex-direction:column;gap:14px\">\n    <h2 style=\"margin:0;font-size:22px;letter-spacing:-0.02em;font-weight:800\">Riwayat terakhir<\u002Fh2>\n    <div style=\"background:#fff;border:1px solid #E7E4DB;border-radius:24px;padding:8px\">\n      <sc-for list=\"{{ hist }}\" as=\"h\" hint-placeholder-count=\"3\">\n        <div style=\"display:flex align-items:center;gap:14px;text-align:center;animation:scmPop .25s ease-out\">\n    <span style=\"padding:6px 14px;border-radius:99px;background:oklch(0.95 0.04 75);color:oklch(0.45 0.13 55);font-weight:800;font-size:13px;white-space:nowrap\">♥ Dukung Super Cerdas<\u002Fspan>\n    <h3 style=\"margin:0;font-size:24px;font-weight:800;letter-spacing:-0.02em;line-height:1.2\">Terima kasih sudah peduli!<\u002Fh3>\n    <p style=\"margin:0;font-size:15px;line-height:1.55;color:#555A6B;text-wrap:pretty\">Scan kode QRIS di bawah dengan m-banking atau e-wallet apa pun (GoPay, OVO, DANA, ShopeePay, LinkAja). Nominal bebas.<\u002Fp>\n    <img src=\"{{ qrisSrc }}\" alt=\"QRIS dukungan\" style=\"width:100%;max-width:300px;border-radius:18px;border:1px solid #E7E4DB;display:block\">\n    <div style=\"display:flex;gap:10px;width:100%;flex-wrap:wrap\">\n      <a href=\"{{ qrisSrc }}\" download=\"QRIS-Dukungan-Super-Cerdas-Matematika.jpg\" style=\"flex:1 1 150px;height:50px;border-radius:16px;background:#1A1C29;color:#fff;font-weight:800;font-size:15px;display:grid;place-items:center;text-decoration:none\">Unduh QRIS<\u002Fa>\n      <button sc-camel-on-click=\"{{ closeSupport }}\" style=\"flex:1 1 120px;height:50px;border-radius:16px;border:1.5px solid #E1DDD2;background:#fff;color:#1A1C29;font-weight:800;font-size:15px;cursor:pointer\">Tutup<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;durasi&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:25,&quot;min&quot;:5,&quot;max&quot;:120,&quot;unit&quot;:&quot;detik&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Kuis&quot;},&quot;jumlahSoal&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:10,&quot;min&quot;:5,&quot;max&quot;:20,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Kuis&quot;},&quot;suara&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Kuis&quot;}}\">\nconst ri=(r,a,b)=>a+Math.floor(r()*(b-a+1));\nconst pick=(r,a)=>a[Math.floor(r()*a.length)];\nconst shuffle=(r,a)=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};\nconst gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);\nconst lcm=(a,b)=>a/gcd(a,b)*b;\nconst F=n=>Number(n).toLocaleString('id-ID',{maximumFractionDigits:2});\nconst N=x=>x<0?'−'+F(-x):F(x);\nconst P=x=>x<0?'('+N(x)+')':N(x);\nconst rd=x=>Math.round(x*100)/100;\nconst money=x=>'Rp'+F(x);\nfunction rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}\nfunction fr(n,d){const g=gcd(n,d);n/=g;d/=g;if(d===1)return F(n);if(n>d){const w=Math.floor(n/d),r=n%d;return w+'{'+r+'/'+d+'}'}return '{'+n+'/'+d+'}'}\nconst raw=(n,d)=>'{'+n+'/'+d+'}';\nfunction numWrong(r,ans,step,neg){const s=new Set([ans]),out=[];const c=shuffle(r,[ans+step,ans-step,ans+1,ans-1,ans+10,ans-10,ans+2*step,ans-2].map(rd));if(neg&&ans!==0)c.unshift(-ans);for(const x of c){if((neg||x>0)&&!s.has(x)){s.add(x);out.push(x)}if(out.length===3)break}let k=3;while(out.length<3){const x=rd(ans+k++);if(!s.has(x)){s.add(x);out.push(x)}}return shuffle(r,out)}\nfunction geoWrong(r,ans,extras,step){const s=new Set([ans]),out=[];for(const e of extras){const x=rd(e);if(x>0&&!s.has(x)){s.add(x);out.push(x)}}for(const x of numWrong(r,ans,step)){if(!s.has(x)){s.add(x);out.push(x)}}return shuffle(r,out.slice(0,3))}\nfunction frWrong(r,n,d,extra){const seen=[n/d],out=[];const c=[...extra,...shuffle(r,[[n+1,d],[n-1,d],[n,d+1],[n+d,d*2+1],[n*2,d],[n,d*2],[n+2,d],[n+1,d+1]])];for(const [a,b] of c){if(a<=0||b<=0)continue;const v=a/b;if(seen.some(s=>Math.abs(s-v)<1e-9))continue;seen.push(v);out.push(fr(a,b));if(out.length===3)break}return out}\nfunction tk(s){const out=[],re=/\\{(\\d+)\\/(\\d+)\\}|\\?/g;let last=0,m;while((m=re.exec(s))){if(m.index>last)out.push({isText:true,v:s.slice(last,m.index)});if(m[0]==='?')out.push({isBlank:true});else out.push({isFrac:true,n:m[1],d:m[2]});last=re.lastIndex}if(last<s.length)out.push({isText:true,v:s.slice(last)});return out}\nconst pack=(prompt,expr,v,wrongs,tip,work,unit,fmt)=>{const f=fmt||(x=>N(x)+(unit?' '+unit:''));return{prompt,expr,ans:f(v),wrong:wrongs.map(f),tip,work,num:v,unit:unit||''}};\nconst SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};\nfunction facS(n){const m={};let p=2;while(n>1){while(n%p===0){m[p]=(m[p]||0)+1;n/=p}p++}return Object.keys(m).map(p=>p+(m[p]>1?String(m[p]).split('').map(c=>SUP[c]).join(''):'')).join(' × ')}\nfunction kw(nums,isK){const R=isK?nums.reduce(lcm):nums.reduce(gcd);const f=facS(R);return nums.map(n=>n+' = '+facS(n)).join('\\n')+'\\n'+(isK?'KPK':'FPB')+' = '+(f!==String(R)?f+' = ':'')+R}\nconst P1='Hitunglah hasilnya.',P2='Tentukan bilangan yang tepat untuk mengisi kotak.';\nconst NAMES=['Andi','Sinta','Budi','Rina','Dimas','Putri','Fajar','Nadia','Raka','Ayu','Bima','Laras'];\nfunction geoMk(r,u){const U=(x,p)=>F(x)+' '+u+p;return(prompt,expr,ans,ex,st,p,tip,work)=>({prompt,expr,ans:U(ans,p),wrong:geoWrong(r,ans,ex,st).map(x=>U(x,p)),tip,work,num:ans,unit:u+p})}\n\nconst GEN={\ntambah(r,l){let a,b,tip;if(l===0){a=ri(r,100,999);b=ri(r,100,999);tip='Jumlahkan mulai dari satuan, puluhan, lalu ratusan. Jika lebih dari 9, simpan ke tempat berikutnya.'}else if(l===1){a=ri(r,1000,9999);b=ri(r,1000,9999);tip='Susun bersusun sesuai nilai tempat, lalu jumlahkan mulai dari satuan.'}else{a=ri(r,10000,99999);b=ri(r,1000,99999);tip='Susun bersusun dengan rapi sesuai nilai tempat (satuan, puluhan, ratusan, ribuan, puluh ribuan).'}\n const c=a+b;\n if(l<2&&r()<0.35)return pack(P2,F(a)+' + ? = '+F(c),b,numWrong(r,b,10),'Bilangan yang hilang = hasil − bilangan yang diketahui.','? = '+F(c)+' − '+F(a)+' = '+F(b));\n return pack(P1,F(a)+' + '+F(b)+' = ?',c,numWrong(r,c,l?100:10),tip,F(a)+' + '+F(b)+' = '+F(c))},\nkurang(r,l){let a,b;if(l===0){a=ri(r,200,999);b=ri(r,50,a-20)}else if(l===1){a=ri(r,2000,9999);b=ri(r,500,a-100)}else{a=ri(r,20000,99999);b=ri(r,1000,a-500)}\n const c=a-b,tip='Kurangkan mulai dari satuan. Jika angka atas lebih kecil, pinjam 1 dari tempat di kirinya.';\n if(l<2&&r()<0.35)return pack(P2,F(a)+' − ? = '+F(c),b,numWrong(r,b,10),'Bilangan pengurang = bilangan awal − hasil.','? = '+F(a)+' − '+F(c)+' = '+F(b));\n return pack(P1,F(a)+' − '+F(b)+' = ?',c,numWrong(r,c,l?100:10),tip,F(a)+' − '+F(b)+' = '+F(c)+'\\nCek: '+F(c)+' + '+F(b)+' = '+F(a))},\nkali(r,l){if(l===0){if(r()<0.4){const a=ri(r,3,12),b=ri(r,3,12),p=a*b;return pack(P2,a+' × ? = '+p,b,numWrong(r,b,1),'Cari bilangan yang jika dikalikan '+a+' hasilnya '+p+'. Gunakan pembagian.','? = '+p+' ÷ '+a+' = '+b)}\n  const a=ri(r,11,49),b=ri(r,3,9),p=a*b,t=a-a%10,o=a%10;return pack(P1,a+' × '+b+' = ?',p,numWrong(r,p,b),'Pecah menjadi puluhan dan satuan, kalikan masing-masing, lalu jumlahkan.',o?a+' × '+b+' = ('+t+' × '+b+') + ('+o+' × '+b+') = '+F(t*b)+' + '+o*b+' = '+F(p):a+' × '+b+' = '+F(p))}\n const a=l===1?ri(r,12,99):ri(r,101,999),b=ri(r,12,99),p=a*b,bt=b-b%10,bo=b%10;\n return pack(P1,a+' × '+b+' = ?',p,numWrong(r,p,a),'Kalikan dengan puluhan dan satuan secara terpisah, lalu jumlahkan.',bo?a+' × '+b+' = ('+a+' × '+bt+') + ('+a+' × '+bo+') = '+F(a*bt)+' + '+F(a*bo)+' = '+F(p):a+' × '+b+' = '+F(p))},\nbagi(r,l){let b,q;if(l===0){b=ri(r,2,9);q=ri(r,11,99)}else if(l===1){b=ri(r,11,25);q=ri(r,12,99)}else{b=ri(r,12,45);q=ri(r,101,999)}\n const p=b*q,tip='Pembagian adalah kebalikan perkalian. Gunakan pembagian bersusun (porogapit).';\n if(l===0&&r()<0.3)return pack(P2,F(p)+' ÷ ? = '+q,b,numWrong(r,b,1),tip,'? = '+F(p)+' ÷ '+q+' = '+b+', karena '+q+' × '+b+' = '+F(p));\n return pack(P1,F(p)+' ÷ '+b+' = ?',q,numWrong(r,q,l===2?10:2),tip,F(p)+' ÷ '+b+' = '+q+', karena '+q+' × '+b+' = '+F(p))},\npecahan(r,l){\n if(l===0){const d=ri(r,3,12),plus=r()<0.55;let n1,n2,n;if(plus){n1=ri(r,1,d-2);n2=ri(r,1,d-n1);n=n1+n2}else{n1=ri(r,2,d-1);n2=ri(r,1,n1-1);n=n1-n2}\n  const o=plus?'+':'−',s=fr(n,d);\n  return{prompt:'Hitunglah dan sederhanakan hasilnya.',expr:raw(n1,d)+' '+o+' '+raw(n2,d)+' = ?',ans:s,wrong:frWrong(r,n,d,[[n,d*2]]),tip:'Jika penyebutnya sama, cukup '+(plus?'jumlahkan':'kurangkan')+' pembilangnya.',work:raw(n1,d)+' '+o+' '+raw(n2,d)+' = '+raw(n,d)+(s!==raw(n,d)?' = '+s:'')}}\n if(l===1){let d1=ri(r,2,10),d2=ri(r,2,10);while(d2===d1)d2=ri(r,2,10);let n1=ri(r,1,d1-1),n2=ri(r,1,d2-1);const plus=r()<0.6||n1/d1===n2/d2;\n  if(!plus&&n1/d1<n2/d2){[n1,n2]=[n2,n1];[d1,d2]=[d2,d1]}\n  const L=lcm(d1,d2),a=n1*L/d1,b=n2*L/d2,n=plus?a+b:a-b,o=plus?'+':'−',s=fr(n,L);\n  return{prompt:'Hitunglah dan sederhanakan hasilnya.',expr:raw(n1,d1)+' '+o+' '+raw(n2,d2)+' = ?',ans:s,wrong:frWrong(r,n,L,[[plus?n1+n2:Math.abs(n1-n2),d1+d2]]),tip:'Samakan penyebut dengan KPK dari '+d1+' dan '+d2+', yaitu '+L+'.',work:raw(n1,d1)+' '+o+' '+raw(n2,d2)+' = '+raw(a,L)+' '+o+' '+raw(b,L)+' = '+raw(n,L)+(s!==raw(n,L)?' = '+s:'')}}\n const b=ri(r,2,10),d=ri(r,2,10),a=ri(r,1,b-1),c=ri(r,1,d-1);\n if(r()<0.5){const n=a*c,m=b*d,s=fr(n,m);return{prompt:'Hitunglah dan sederhanakan hasilnya.',expr:raw(a,b)+' × '+raw(c,d)+' = ?',ans:s,wrong:frWrong(r,n,m,[[a*d,b*c],[a+c,b+d]]),tip:'Kalikan pembilang dengan pembilang dan penyebut dengan penyebut, lalu sederhanakan.',work:raw(a,b)+' × '+raw(c,d)+' = '+raw(n,m)+(s!==raw(n,m)?' = '+s:'')}}\n const n=a*d,m=b*c,s=fr(n,m);return{prompt:'Hitunglah dan sederhanakan hasilnya.',expr:raw(a,b)+' ÷ '+raw(c,d)+' = ?',ans:s,wrong:frWrong(r,n,m,[[a*c,b*d]]),tip:'Ubah pembagian menjadi perkalian dengan kebalikan pecahan kedua.',work:raw(a,b)+' ÷ '+raw(c,d)+' = '+raw(a,b)+' × '+raw(d,c)+' = '+raw(n,m)+(s!==raw(n,m)?' = '+s:'')}},\ndesimal(r,l){\n if(l===0){let a=ri(r,11,99)/10,b=ri(r,11,99)/10;const plus=r()<0.55;if(!plus&&a<b)[a,b]=[b,a];if(a===b)b=rd(b-0.1);const c=rd(plus?a+b:a-b),o=plus?'+':'−';\n  return pack(P1,F(a)+' '+o+' '+F(b)+' = ?',c,n
